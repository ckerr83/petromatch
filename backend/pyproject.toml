[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petromatch-backend"
version = "0.1.0"
description = "Personal oil and gas job discovery backend MVP"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2,<2.0.0",
  "beautifulsoup4>=4.12.3,<5.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "google-api-python-client>=2.140.0,<3.0.0",
  "google-auth-httplib2>=0.2.0,<1.0.0",
  "google-auth-oauthlib>=1.2.1,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "psycopg[binary]>=3.2.1,<4.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "sqlalchemy>=2.0.34,<3.0.0",
  "structlog>=24.4.0,<25.0.0",
  "uvicorn[standard]>=0.30.6,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
