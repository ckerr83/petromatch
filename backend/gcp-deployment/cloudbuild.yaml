steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/petromatch-backend', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/petromatch-backend']
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'petromatch-backend', '--image', 'gcr.io/$PROJECT_ID/petromatch-backend',
   '--region', 'us-central1', '--allow-unauthenticated']
